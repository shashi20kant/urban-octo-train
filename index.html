<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><style>
          *{box-sizing:border-box; margin:0;} body{ background:#020617; color:#e2e8f0; font-family:Arial,sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
          .sections{ flex:1; overflow-y:auto; padding:16px; }
          .section-card{ background:#0f172a; border-radius:16px; margin-bottom:24px; padding:14px; border:1px solid #334155; }
          .section-title{ font-size:1.2rem; font-weight:bold; border-left:5px solid #34d399; padding-left:12px; margin-bottom:12px; }
          .mcq-item{ margin-bottom:18px; border-bottom:1px solid #2d3a5e; padding-bottom:12px; }
          .q-text{ font-weight:600; margin-bottom:8px; }
          .opt-row{ display:flex; gap:12px; align-items:center; margin:6px 0; }
          .subj-item{ margin-bottom:20px; }
          .subj-q{ font-weight:600; margin-bottom:5px; }
          textarea{ width:100%; background:#0b1120; border:1px solid #334155; border-radius:10px; padding:10px; color:#e2e8f0; font-size:14px; margin-top:6px; }
          .ctrl-bar{ background:#020617; border-top:1px solid #1e293b; padding:10px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
          button{ background:#334155; border:none; border-radius:24px; padding:8px 16px; color:white; font-weight:bold; cursor:pointer; }
          .btn-submit{ background:linear-gradient(135deg,#16a34a,#15803d); }
          .pill-nav{ background:#1e293b; margin:0 2px; width:36px; border-radius:30px; }
          .active-tab{ background:#22d3ee; color:#000; }
          .status-hint{ font-size:12px; color:#94a3b8; text-align:center; margin:4px; }
          .badge{ background:#14532d; border-radius:16px; padding:2px 8px; font-size:12px; display:inline-block; margin-left:8px; }
        </style></head><body>
        <div class="sections" id="sectionsContainer"></div>
        <div class="ctrl-bar">
          <button id="prevMcqBtn" class="pill-nav">◀</button>
          <span id="mcqCounter"></span>
          <button id="nextMcqBtn" class="pill-nav">▶</button>
          <button id="prevSubBtn" class="pill-nav">◀</button>
          <span id="subCounter"></span>
          <button id="nextSubBtn" class="pill-nav">▶</button>
          <button id="submitFinalBtn" class="btn-submit">✅ Submit Exam</button>
        </div>
        <div class="status-hint" id="saveHint"></div>
        <script>
          const sessionId = "${sessionId}";
          const storageKey = "exam_answers_"+sessionId;
          const mcqs = ${JSON.stringify(mcqs)};
          const subjective = ${JSON.stringify(subjective)};
          let mcqAnswers = {}, subjAnswers = {};
          let currentMcqIdx = 0, currentSubIdx = 0, activeSection = "mcq";

          function loadState(){
            const raw = localStorage.getItem(storageKey);
            if(raw) try{ const data=JSON.parse(raw); mcqAnswers=data.mcqAnswers||{}; subjAnswers=data.subjAnswers||{}; }catch(e){}
          }
          function persist(){
            localStorage.setItem(storageKey, JSON.stringify({ mcqAnswers, subjAnswers, updatedAt:new Date().toISOString() }));
            document.getElementById("saveHint").textContent = "✓ Auto-saved at "+new Date().toLocaleTimeString();
          }
          function render(){
            const container = document.getElementById("sectionsContainer");
            if(activeSection === "mcq"){
              const q = mcqs[currentMcqIdx];
              const selected = mcqAnswers[q.id] || "";
              let html = \`<div class="section-card"><div class="section-title">📌 MCQ \${currentMcqIdx+1} of \${mcqs.length}</div>
              <div class="q-text">\${esc(q.text)}</div>\`;
              Object.entries(q.options).forEach(([key,val])=>{
                const checked = (selected === key) ? "checked" : "";
                html += \`<label class="opt-row"><input type="radio" name="mcqOpt" value="\${key}" \${checked}> <strong>\${key}.</strong> \${esc(val)}</label>\`;
              });
              html += \`</div>\`;
              container.innerHTML = html;
              document.querySelectorAll('input[name="mcqOpt"]').forEach(radio=>{
                radio.addEventListener('change',(e)=>{ mcqAnswers[q.id]=e.target.value; persist(); render(); });
              });
            } else {
              const sub = subjective[currentSubIdx];
              const answerVal = subjAnswers[sub.id] || "";
              let html = \`<div class="section-card"><div class="section-title">✍️ Subjective Q\${currentSubIdx+1} of \${subjective.length} (3 marks)</div>
              <div class="subj-q">\${esc(sub.q)}</div>
              <textarea rows="4" placeholder="Apna uttar yahan likhein..." id="subjTextarea">\${esc(answerVal)}</textarea></div>\`;
              container.innerHTML = html;
              const ta = document.getElementById("subjTextarea");
              ta.addEventListener('input',(e)=>{ subjAnswers[sub.id] = e.target.value; persist(); });
            }
            document.getElementById("mcqCounter").innerText = \`MCQ \${currentMcqIdx+1}/\${mcqs.length}\`;
            document.getElementById("subCounter").innerText = \`Sub \${currentSubIdx+1}/\${subjective.length}\`;
          }
          function esc(str){ return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
          function switchSection(section){
            activeSection = section;
            render();
          }
          document.getElementById("prevMcqBtn").onclick = ()=>{ if(currentMcqIdx>0){ currentMcqIdx--; activeSection="mcq"; render(); } };
          document.getElementById("nextMcqBtn").onclick = ()=>{ if(currentMcqIdx<mcqs.length-1){ currentMcqIdx++; activeSection="mcq"; render(); } };
          document.getElementById("prevSubBtn").onclick = ()=>{ if(currentSubIdx>0){ currentSubIdx--; activeSection="subjective"; render(); } };
          document.getElementById("nextSubBtn").onclick = ()=>{ if(currentSubIdx<subjective.length-1){ currentSubIdx++; activeSection="subjective"; render(); } };
          document.getElementById("submitFinalBtn").onclick = ()=>{ if(window.parent) window.parent.postMessage("submit_exam","*"); };
          loadState(); persist(); render();
          // focus/blur messaging for parent
          let focusLost=false;
          window.addEventListener("blur",()=>{ if(!focusLost){ focusLost=true; window.parent.postMessage("exam_focus_lost","*"); } });
          window.addEventListener("focus",()=>{ if(focusLost){ focusLost=false; window.parent.postMessage("exam_focus_returned","*"); } });
        <\/script>
        </body></html>`;
      }

      // Start exam
      function startExam(){
        if(isExamViewportTooSmall()){ setStatus( "Screen size chhota hai", "bad"); updateStartGateUi(); return; }
        if(!isStartGateOpen()){ setStatus("Time gate band", "warn"); return; }
        if(examRunning) return;
        submitted=false;
        report = { studentName, timezone:Intl.DateTimeFormat().resolvedOptions().timeZone, userAgent:navigator.userAgent, exam:{ durationSeconds:EXAM_SECONDS, startAt:null, submitAt:null, submitReason:null, sessionId:null }, inactiveSessions:[], events:[], result:{ totalQuestions:20, attempted:0, correct:0, wrong:0, unattempted:0, baseScore:0, leaveIncidentCount:0, negativeMarks:0, finalScore:0, selections:[] }, summary:{ totalInactiveMs:0 } };
        examRunning=true;
        sid = `sess_${Date.now()}`;
        localStorage.setItem(STORAGE.active, sid);
        startAtMs = Date.now();
        report.exam.startAt = nowIso();
        report.exam.sessionId = sid;
        report.studentName = studentName;
        addEvent("exam_started");
        examOverlay.classList.add("active");
        timerBox.style.display = "block";
        document.body.classList.add("in-exam");
        // generate iframe content
        const htmlContent = buildQuestionsHtml(sid);
        frame.srcdoc = htmlContent;
        requestFS();
        const endTs = startAtMs + EXAM_SECONDS*1000;
        if(timerInt) clearInterval(timerInt);
        timerInt = setInterval(()=>{
          const rem = Math.ceil((endTs-Date.now())/1000);
          timerEl.textContent = mmss(rem);
          if(rem<=0 && !submitted) submitExam("timeout");
        }, 300);
        if(focusPollInt) clearInterval(focusPollInt);
        focusPollInt = setInterval(checkParentFocus, 300);
        setStatus("Exam chal raha hai...", "ok");
      }

      function computeResultFromStorage(){
        const raw = localStorage.getItem(STORAGE.answersPrefix+sid);
        if(!raw) return;
        try{
          const data = JSON.parse(raw);
          const mcqList = data.mcqAnswers || {};
          // we need original mcq list (hardcoded same as buildQuestionsHtml)
          const staticMcqs = [
            { id:"mcq1", correct:"B" },{ id:"mcq2", correct:"A" },{ id:"mcq3", correct:"A" },{ id:"mcq4", correct:"A" },{ id:"mcq5", correct:"A" },{ id:"mcq6", correct:"C" },{ id:"mcq7", correct:"B" },{ id:"mcq8", correct:"C" },{ id:"mcq9", correct:"C" },{ id:"mcq10", correct:"A" },{ id:"mcq11", correct:"A" },{ id:"mcq12", correct:"B" },{ id:"mcq13", correct:"D" },{ id:"mcq14", correct:"C" },{ id:"mcq15", correct:"A" },{ id:"mcq16", correct:"A" },{ id:"mcq17", correct:"A" },{ id:"mcq18", correct:"B" },{ id:"mcq19", correct:"A" },{ id:"mcq20", correct:"B" }
          ];
          let correct=0, attempted=0;
          const selections=[];
          for(let i=0;i<staticMcqs.length;i++){
            const m=staticMcqs[i];
            const selected = mcqList[m.id] || null;
            const isCorrect = (selected && selected === m.correct);
            if(selected) attempted++;
            if(isCorrect) correct++;
            selections.push({ id:m.id, selected, correctOption:m.correct, isCorrect, explanation: "Explanation: "+ (m.id==="mcq1"?"Perpendicular to surface":m.id==="mcq2"?"p×E":m.id==="mcq3"?"1/ε₀":m.id==="mcq4"?"Zero":m.id==="mcq5"?"Farad":m.id==="mcq6"?"Voltage same":m.id==="mcq7"?"Area/Dielectric":m.id==="mcq8"?"Central force":m.id==="mcq9"?"1":m.id==="mcq10"?"σ/ε₀":m.id==="mcq11"?"E/E₀":m.id==="mcq12"?"N/C":m.id==="mcq13"?"Never intersect":m.id==="mcq14"?"Double":m.id==="mcq15"?"10V":m.id==="mcq16"?"Q/A":m.id==="mcq17"?"Conservative":m.id==="mcq18"?"Nm²/C":m.id==="mcq19"?"9×10⁹":m.id==="mcq20"?"8.85×10⁻¹² F/m":"") });
          }
          const leaveCount = report.inactiveSessions.length;
          const negativeMarks = Math.floor(leaveCount / 3);
          const baseScore = correct;
          const finalScore = Math.max(0, baseScore - negativeMarks);
          report.result = { totalQuestions:20, attempted, correct, wrong:attempted-correct, unattempted:20-attempted, baseScore, leaveIncidentCount:leaveCount, negativeMarks, finalScore, selections, subjectiveAnswers: data.subjAnswers || {} };
          saveDraft();
        }catch(e){}
      }

      function submitExam(reason="manual"){
        if(!examRunning || submitted) return;
        submitted=true; examRunning=false; submitAtMs=Date.now();
        if(inactiveStartMs) markInactiveEnd("submit_flush");
        if(timerInt) clearInterval(timerInt);
        if(focusPollInt) clearInterval(focusPollInt);
        report.exam.submitAt = nowIso(); report.exam.submitReason=reason;
        addEvent("exam_submitted",{reason});
        computeResultFromStorage();
        saveDraft();
        examOverlay.classList.remove("active");
        timerBox.style.display="none";
        document.body.classList.add("pre-exam");
        afterSubmitActions.classList.remove("hidden");
        setStatus("Exam submit! Report generate ho gayi.", "ok");
        shareModalWrap.classList.add("show");
        renderSnapshot();
        updateStartGateUi();
        examBtn.disabled = false;
        examBtn.textContent = "Start Exam";
      }

      function setStatus(msg,type){ statusEl.innerHTML = `<span class="${type||''}">${msg}</span>`; }

      window.addEventListener("message", (e)=>{
        if(e.data === "submit_exam") submitExam("manual");
        if(e.data === "exam_focus_lost") markInactiveStart("iframe_blur");
        if(e.data === "exam_focus_returned") markInactiveEnd("iframe_focus");
      });
      examBtn.addEventListener("click",()=>{ if(examRunning && !submitted) submitExam("manual"); else startExam(); });
      shareModalOk.onclick = ()=> shareModalWrap.classList.remove("show");
      openPdfBtn.onclick = ()=>{ if(report.result.selections) buildAndOpenReport(); };
      shareBtn.onclick = async()=>{ const txt = buildPlainTextReport(); if(navigator.share) await navigator.share({text:txt}); else navigator.clipboard.writeText(txt); };
      viewResultBtn.onclick = ()=> buildAndOpenReport();
      downloadResultBtn.onclick = ()=>{ const html = buildFullReportHTML(); downloadFile(`Electrostatics_${studentName}_report.html`, html); };
      function buildFullReportHTML(){ let html = `<html><head><meta charset="UTF-8"><title>Exam Report ${studentName}</title><style>body{background:#0b1220;color:#e2e8f0;font-family:Arial;padding:20px;} .q-item{margin-bottom:20px;border-bottom:1px solid #334155;}</style></head><body><h1>⚡ Physics - Electrostatics Report</h1><p>Student: ${esc(studentName)} | Negative Marks: ${report.result.negativeMarks} | Final Score: ${report.result.finalScore}/20 (MCQ) + Subjective answers recorded.</p><h2>MCQ Analysis</h2>`;
        report.result.selections.forEach((s,i)=>{ html+=`<div class="q-item"><b>Q${i+1}:</b> Selected: ${s.selected||'Unattempted'} | Correct: ${s.correctOption} | ${s.isCorrect?'✓ Right':'✗ Wrong'}<br><small>📘 ${s.explanation}</small></div>`; });
        html+=`<h2>Subjective Answers</h2>`;
        Object.entries(report.result.subjectiveAnswers||{}).forEach(([id,ans])=>{ html+=`<div><b>${id}:</b> <pre>${esc(ans)}</pre></div>`; });
        html+=`<p>Inactive count: ${report.inactiveSessions.length} → Negative marks: ${report.result.negativeMarks}</p></body></html>`;
        return html;
      }
      function buildPlainTextReport(){ return `Electrostatics Exam\nStudent:${studentName}\nScore:${report.result.finalScore}/20\nNegative:${report.result.negativeMarks}`; }
      function buildAndOpenReport(){ const blob = new Blob([buildFullReportHTML()],{type:"text/html"}); const url=URL.createObjectURL(blob); window.open(url); setTimeout(()=>URL.revokeObjectURL(url),10000); }
      function downloadFile(name,content){ const a=document.createElement('a'); const blob=new Blob([content],{type:"text/html"}); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

      // initial ui
      updateStartGateUi();
      window.addEventListener("load",()=>{ if(studentName) updateStartGateUi(); });
    })();
  </script>
</body>
</html>
